name: V2 Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0/4 * * *'

jobs:
  Windows-build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 版本对比
        run: |
          # 获取上游最新正式 release, /releases/latest 自动排除 draft 和 prerelease
          $release = Invoke-WebRequest -Uri https://api.github.com/repos/jxxghp/MoviePilot/releases/latest | ConvertFrom-Json
          $upstream_tag = $release.tag_name
          Write-Output "上游最新 release: $upstream_tag"

          # 解析 release tag 指向的 commit sha, 兼容 annotated tag 需要二次解引用
          $ref = Invoke-WebRequest -Uri "https://api.github.com/repos/jxxghp/MoviePilot/git/ref/tags/$upstream_tag" | ConvertFrom-Json
          $release_sha = $ref.object.sha
          if ($ref.object.type -eq "tag") {
            $tag_object = Invoke-WebRequest -Uri "https://api.github.com/repos/jxxghp/MoviePilot/git/tags/$release_sha" | ConvertFrom-Json
            $release_sha = $tag_object.object.sha
          }
          $short_sha = $release_sha.Substring(0, 7)
          Write-Output "release commit: $release_sha ($short_sha)"

          # 与本仓库已发布的最新版本对比, 首次发版时没有 release 会返回 404
          $current_tag = ""
          try {
            $current = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
            $current_tag = $current.tag_name
          } catch {
            Write-Output "本仓库暂无 release"
          }
          Write-Output "本仓库最新 release: $current_tag"

          if ($current_tag -and $current_tag.Contains($short_sha)) {
            Write-Output "上游无新 release, 无需打包"
            exit 1
          }
          Write-Output "检测到上游新 release $upstream_tag, 执行打包"

          echo "UPSTREAM_TAG=$upstream_tag" >> $env:GITHUB_ENV
          echo "HASH_VERSION=$short_sha" >> $env:GITHUB_ENV
          echo "RELEASE_BODY=基于上游 release $upstream_tag ($short_sha) 打包 $($release.html_url)" >> $env:GITHUB_ENV

      - name: 拉取打包脚本
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 构建安装包
        id: build
        uses: ./.github/actions/build-package
        with:
          upstream-tag: ${{ env.UPSTREAM_TAG }}
          hash-version: ${{ env.HASH_VERSION }}

      # 装不上、起不来的包不发布
      - name: 冒烟测试
        uses: ./.github/actions/smoke-test

      - name: 取当前时间
        run: |
          $currentUtcTime = (Get-Date).ToUniversalTime()
          $shanghaiTimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $shanghaiTime = [System.TimeZoneInfo]::ConvertTimeFromUtc($currentUtcTime, $shanghaiTimeZone)
          $formattedShanghaiTime = $shanghaiTime.ToString("yyyyMMddHHmmss")
          echo "SHANGHAI_TIMEZONE=$formattedShanghaiTime" >> $env:GITHUB_ENV

      - name: 创建 release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.build.outputs.app-version }}.${{ env.SHANGHAI_TIMEZONE }}.${{ env.HASH_VERSION }}
          tag_name: ${{ steps.build.outputs.version }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          make_latest: true
          files: ./exe/build/*.exe

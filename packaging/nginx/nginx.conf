# MoviePilot Windows 便携版 nginx 配置
# 改编自上游 docker/nginx.template.conf, 去掉 Linux 专有指令(user/pid), 路径改为相对 nginx 前缀目录

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 站点图标缓存, 相对 nginx 前缀目录
    proxy_cache_path temp/proxy_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    sendfile on;
    keepalive_timeout 3600;

    # 不限制上传体积, 便于插件上传大文件
    client_max_body_size 0;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 6;

    # 后端 API, 端口需与 config/app.env 中的 PORT 一致
    upstream backend_api {
        server 127.0.0.1:3111;
    }

    # 前端, 端口需与 config/app.env 中的 NGINX_PORT 一致
    server {
        listen 3333;
        server_name moviepilot;

        access_log logs/access.log;
        error_log  logs/error.log;

        include common.conf;
    }
}
